<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Folder Body - Ghost Fading Effect -->
  <path d="M18 36C18 31.5817 21.5817 28 26 28H48L58 38H102C106.418 38 110 41.5817 110 46V92C110 96.4183 106.418 100 102 100H26C21.5817 100 18 96.4183 18 92V36Z" fill="url(#folderGrad)" opacity="0.25" stroke="url(#folderGrad)" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- Ghost Inner .vscode Label -->
  <text x="64" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-weight="800" font-size="20" fill="#34d399" opacity="0.6" text-anchor="middle">.vscode</text>

  <!-- Clean Sparkle Eraser Effect -->
  <path d="M88 28L92 40L104 44L92 48L88 60L84 48L72 44L84 40L88 28Z" fill="url(#folderGrad)" filter="url(#glow)" />
  <circle cx="34" cy="80" r="4" fill="#34d399" opacity="0.8" />
  <circle cx="98" cy="82" r="3" fill="#34d399" opacity="0.8" />

  <!-- Diagonal Disappearing Cut Line -->
  <line x1="24" y1="96" x2="104" y2="32" stroke="#34d399" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.9" />
</svg>
